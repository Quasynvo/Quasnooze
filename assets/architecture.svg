<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">Quasnooze request and Fluid Motion architecture</title><desc id="desc">Text and opt-in audio use existing speech and model paths. Policy and approval gate sensitive actions. Application state and separately sourced audio signals drive the visualizer. The playground analyzes microphone audio locally without transcription. Native amplitude is not FFT data.</desc><defs><linearGradient id="line"><stop stop-color="#6ee7f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8cb4d0"/></marker><style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#edf4ff}.small{font-size:13px;fill:#a8bbce}.label{font-size:11px;letter-spacing:1.5px;fill:#a8bbce}.head{font-size:18px;font-weight:600}.box{fill:#111d30;stroke:#34445e;stroke-width:1}.flow{fill:none;stroke:#8cb4d0;stroke-width:1.5;marker-end:url(#arrow)}</style></defs><rect width="1200" height="570" rx="20" fill="#080d19"/><text x="40" y="43" class="label">QUASNOOZE / REQUEST + PRESENTATION BOUNDARIES</text><text x="40" y="78" font-size="25" font-weight="600">One assistant. Explicit signals.</text><rect x="40" y="112" width="225" height="113" rx="13" class="box"/><text x="60" y="143" class="head">Text or opt-in audio</text><text x="60" y="170" class="small">Web · Windows · channels</text><text x="60" y="193" class="small">Microphone starts off</text><rect x="320" y="112" width="245" height="113" rx="13" class="box"/><text x="340" y="143" class="head">Existing speech / model</text><text x="340" y="170" class="small">System.Speech · browser STT</text><text x="340" y="193" class="small">Ollama · optional Whisper</text><rect x="620" y="112" width="230" height="113" rx="13" class="box" stroke="#ffbf69"/><text x="640" y="143" class="head">Policy + approval</text><text x="640" y="170" class="small">Risk tiers · workspace limits</text><text x="640" y="193" class="small">Explicit sensitive-action consent</text><rect x="905" y="112" width="255" height="113" rx="13" class="box"/><text x="925" y="143" class="head">Visible result</text><text x="925" y="170" class="small">Text · native speech · tool result</text><text x="925" y="193" class="small">Typed failures, not fake success</text><path d="M265 168H320M565 168H620M850 168H905" class="flow"/><text x="40" y="278" class="label">FLUID MOTION / PRESENTATION LAYER — NEVER GRANTS PERMISSION</text><rect x="40" y="304" width="225" height="125" rx="13" class="box"/><text x="60" y="337" class="head">Audio Stream Handler</text><text x="60" y="365" class="small">Explicit playground capture</text><text x="60" y="388" class="small">Stop · abort · device cleanup</text><text x="60" y="411" class="small">No recording or upload</text><rect x="320" y="304" width="245" height="125" rx="13" class="box"/><text x="340" y="337" class="head">Signal sources</text><text x="340" y="365" class="small">FFT + RMS: playground only</text><text x="340" y="388" class="small">Native scalar: amplitude, not FFT</text><text x="340" y="411" class="small">Synthetic / none: labelled</text><rect x="620" y="304" width="230" height="125" rx="13" class="box" stroke="url(#line)"/><text x="640" y="337" class="head">Reactive Motion Engine</text><text x="640" y="365" class="small">Idle · listening · thinking</text><text x="640" y="388" class="small">Speaking · error</text><text x="640" y="411" class="small">Spring smoothing · reduced motion</text><rect x="905" y="304" width="255" height="125" rx="13" class="box"/><text x="925" y="337" class="head">Accessible interface</text><text x="925" y="365" class="small">Canvas + static SVG fallback</text><text x="925" y="388" class="small">Text state announcements</text><text x="925" y="411" class="small">Separate approval controls</text><path d="M265 367H320M565 367H620M850 367H905" class="flow"/><path d="M1035 225V265H735V304" class="flow"/><text x="755" y="258" class="small">reported application state</text><path d="M152 225V304" class="flow"/><text x="40" y="477" class="small">Speech recognition and audio analysis are separate paths. Browser STT may use a vendor service.</text><text x="40" y="503" class="small">Native speaking currently uses decorative spectrum motion. Output-frequency reactivity needs an output analyser.</text><text x="40" y="541" class="label">LOCAL INTELLIGENCE · VISIBLE SIGNAL · YOUR PERMISSION, FIRST</text></svg>
