<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Quasnooze — how a request moves</title><desc id="desc">A user asks through native, web or chat. Simple supported local actions use a fast path; other requests use the configured model. Both pass policy and any required approval before execution and a visible result. Local does not mean sandboxed.</desc><defs><linearGradient id="bg"><stop stop-color="#101a30"/><stop offset="1" stop-color="#090d1b"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#83f5ed"/></marker></defs><rect width="1200" height="340" rx="20" fill="url(#bg)"/><g fill="#a8b5cd" font-family="Arial,sans-serif"><text x="35" y="39" font-size="12" letter-spacing="2">ONE REQUEST. VISIBLE BOUNDARIES.</text><g fill="#121f34" stroke="#334666"><rect x="35" y="120" width="180" height="96" rx="12"/><rect x="285" y="67" width="225" height="79" rx="12"/><rect x="285" y="190" width="225" height="79" rx="12"/><rect x="585" y="120" width="230" height="96" rx="12"/><rect x="890" y="120" width="270" height="96" rx="12"/></g><g fill="none" stroke="#83f5ed" stroke-width="1.5" marker-end="url(#arrow)"><path d="M215 157L250 157L250 107L280 107"/><path d="M215 178L250 178L250 228L280 228"/><path d="M510 107L548 107L548 157L580 157"/><path d="M510 228L548 228L548 178L580 178"/><path d="M815 168H882"/></g><g font-size="19" fill="#eef6ff"><text x="57" y="155">You ask</text><text x="306" y="99">Local intent</text><text x="306" y="222">Configured model</text><text x="607" y="155">Policy + approval</text><text x="914" y="155">Action → visible result</text></g><g font-size="12"><text x="57" y="183">Native · web · channels</text><text x="306" y="124">Supported deterministic actions</text><text x="306" y="247">Local by default · cloud optional</text><text x="607" y="183">Sensitive actions need consent</text><text x="914" y="183">Success, failure, sources or uncertainty</text><text x="35" y="315">The cosmic animation is presentation, not permission. Plugins are not OS-sandboxed. No hidden microphone access.</text></g></g></svg>
