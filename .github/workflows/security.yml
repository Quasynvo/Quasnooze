name: Security

# Continuous security scanning. Nothing here can write to the repository: every
# job is read-only except for the report it uploads to the Security tab.
#
#   codeql             — semantic analysis of our own JavaScript
#   dependency-review  — blocks a PR that introduces a known-vulnerable package
#   scorecard          — an external grade of this repo's supply-chain hygiene
#
# Third-party actions are pinned to a commit SHA, not a tag: a tag is a mutable
# pointer, and "the code that runs in your CI" is not something to let anyone
# re-point. Dependabot keeps the pins fresh (.github/dependabot.yml).

on:
  push:
    # Every branch, not just main: OpenSSF Scorecard's SAST check counts the
    # share of commits that a static analyser has seen, and a push to a
    # short-lived branch is still a commit in the history that ships.
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "27 4 * * *" # daily, off-peak
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (javascript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:javascript-typescript"

  dependency-review:
    name: Dependency review (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  scorecard:
    name: OpenSSF Scorecard
    # Publish only from the default branch: scorecard-action uploads results
    # against main, and a branch-local run has nothing to publish.
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write # required to publish results to the OpenSSF API
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif

  semgrep:
    name: Semgrep (security-audit + secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # Version-pinned tool, installed from PyPI - the same pin verified
      # locally against this tree (0 findings on the scanned directories).
      - name: Install Semgrep
        run: pip install "semgrep==1.184.0"
      - name: Semgrep scan (gating)
        run: >-
          semgrep scan --config p/security-audit --config p/secrets
          --metrics off --error --sarif --output semgrep.sarif
          src scripts bin public desktop
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: Gitleaks (secret history scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: a secret deleted later still leaked
      # Release binary verified against the publisher's checksums file
      # (sha256 pinned here), instead of a third-party action that would
      # need an org licence. Verified locally: 163 commits, only canary
      # fixtures in tests, allowlisted by path+rule in .gitleaks.toml.
      - name: Install Gitleaks (checksum-verified)
        run: |
          curl -sL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Gitleaks scan (gating)
        run: /tmp/gitleaks git --redact --no-banner --report-format sarif --report-path gitleaks.sarif .
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  osv-scanner:
    name: OSV-Scanner (dependency vulnerabilities)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Report-first: results publish to the Security tab while the
      # baseline is reviewed; promotion to gating is a deliberate follow-up
      # once the first report is triaged (see docs/SCANNERS.md).
      - name: OSV-Scanner (report-only)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            --format sarif
            --output osv.sarif
            ./
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  trivy:
    name: "Trivy (filesystem: vuln, secret, misconfig)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Report-first for the same reason as OSV above (exit-code 0);
      # SARIF still lands in the Security tab for triage.
      - name: Trivy filesystem scan (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy

  zizmor:
    name: zizmor (workflow security audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Audits the workflows themselves (template injection, excessive
      # permissions, unpinned actions). Plain mode: annotations on the PR,
      # no GitHub Advanced Security requirement.
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
