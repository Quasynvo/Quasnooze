name: PR area change metrics

# pull_request_target is intentional: the privileged job checks out ONLY the
# trusted default branch and reads PR objects with git; it never checks out,
# imports, installs, or executes code from the PR, including fork PRs.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to refresh
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr-area-metrics-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  report:
    name: PR area change metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Compare tracked trees and update bot comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          # Temporary instrumentation: every step reports through annotations so
          # the failing command is visible without log access. Revert when done.
          set -uo pipefail
          step() { echo "::notice::pr-growth step $1 ok"; }
          die() { echo "::error::pr-growth FAILED at step $1: $2"; exit 1; }
          echo "::notice::pr-growth instrumented run; gh=$(gh --version | head -1); node=$(node --version)"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || die 1 "invalid PR number: $PR_NUMBER"
          OUT="$(gh api "repos/$REPO/pulls/$PR_NUMBER" 2>&1)" || die 2 "gh api pulls failed: $OUT"
          printf '%s' "$OUT" > /tmp/pr-metrics-meta.json
          [ "$(jq -r .state /tmp/pr-metrics-meta.json)" = open ] || die 3 "PR is not open"
          BASE_SHA="$(jq -r .base.sha /tmp/pr-metrics-meta.json)"
          HEAD_SHA="$(jq -r .head.sha /tmp/pr-metrics-meta.json)"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || die 4 "invalid SHAs base=$BASE_SHA head=$HEAD_SHA"
          step 4
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          OUT="$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr-metrics/head" 2>&1)" || die 5 "git fetch failed: $OUT"
          unset AUTH
          step 5
          [ "$(git rev-parse refs/remotes/pr-metrics/head)" = "$HEAD_SHA" ] || die 6 "PR head changed: local $(git rev-parse refs/remotes/pr-metrics/head) vs api $HEAD_SHA"
          step 6
          OUT="$(node scripts/pr-growth.js "$BASE_SHA" "$HEAD_SHA" 2>&1 > /tmp/pr-metrics-comment.md)" || die 7 "node pr-growth.js failed: $OUT"
          step 7
          CURRENT_HEAD="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha 2>&1)" || die 8 "gh api head failed: $CURRENT_HEAD"
          [ "$CURRENT_HEAD" = "$HEAD_SHA" ] || die 9 "PR head changed during run: $CURRENT_HEAD vs $HEAD_SHA"
          step 9
          COMMENT_ID="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" 2>/tmp/gh-comments.err | jq -s '[.[][] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains("<!-- pr-growth-metrics -->")))] | last | .id // empty')" || die 10 "comment lookup failed: $(cat /tmp/gh-comments.err)"
          step 10
          if [ -n "$COMMENT_ID" ]; then
            OUT="$(gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@/tmp/pr-metrics-comment.md 2>&1 >/dev/null)" || die 11 "comment PATCH failed id=$COMMENT_ID: $OUT"
          else
            OUT="$(gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@/tmp/pr-metrics-comment.md 2>&1 >/dev/null)" || die 12 "comment POST failed: $OUT"
          fi
          step 12
