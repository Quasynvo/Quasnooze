name: "ZZ CodeQL dump (temporary)"
on:
  push:
    branches: [arena/a0c87ae0-quasnooze]
  workflow_dispatch: {}
permissions:
  contents: read
  security-events: write
jobs:
  dump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: csharp
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        id: analyze
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: results
          post-processed-sarif-path: results-post
      - name: Dump results
        run: |
          echo "=== SARIF DIR ==="
          ls -la results results-post 2>/dev/null || true
          echo "=== SUMMARY ==="
          for f in results/*.sarif results-post/*.sarif; do
            [ -f "$f" ] || continue
            echo "FILE: $f"
            jq -r '.runs[0].results | length' "$f" | sed 's/^/COUNT: /'
            jq -r '.runs[0].results[] | [.ruleId, .locations[0].physicalLocation.artifactLocation.uri, (.locations[0].physicalLocation.region.startLine|tostring), (.locations[0].physicalLocation.region.startColumn|tostring), .message.text] | @tsv' "$f"
          done
          echo "=== END ==="
