# zizmor configuration.
#
# welcome.yml uses pull_request_target - normally a red flag, and worth
# one. Review (2026-11-06): that workflow never checks out the PR tree,
# runs no fork code, reads only event metadata and posts one comment
# with a write token scoped to pull-requests/issues. Its own header
# documents this as design rule 2. Suppress the rule for that file only;
# dangerous-triggers still gates every other workflow.
rules:
  dangerous-triggers:
    ignore:
      - welcome.yml
      # roadmap-status-bot listens for the "Contributor queue" workflow
      # finishing. Its job checks out the DEFAULT branch only
      # (persist-credentials: false), runs this repo's own
      # scripts/roadmap-bots.js with an issues:write token, and never
      # checks out or executes the triggering run's tree.
      - roadmap-status-bot.yml
